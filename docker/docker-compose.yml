services:

  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: music_recommendation_system_db
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: fastapi-backend
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=mysql+pymysql://root:123456@db:3306/music_recommendation_system_db
      - JWT_SECRET_KEY=your-secret-key-here
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_MINUTES=1440
      # URL tới PhoBERT service (Module 1 chạy riêng)
      # Nếu Module 1 chạy trên máy host: dùng host.docker.internal:5001
      # Nếu Module 1 chưa chạy: backend tự fallback về keyword matching
      - PHOBERT_API_URL=http://host.docker.internal:5001
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: vite-frontend
    ports:
      - "5173:5173"
    volumes:
      - ../Frontend/src:/app/src
    depends_on:
      - backend

volumes:
  mysql_data:
